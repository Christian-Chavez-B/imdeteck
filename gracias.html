<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="imagenes/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>Gracias - IMDETECK</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .gracias-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 20px;
        }
        .gracias-container i {
            font-size: 80px;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        .gracias-container h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .gracias-container p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-volver {
            background-color: #25D366;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .btn-volver:hover {
            background-color: #128C7E;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="gracias-container">
        <i class="fa-regular fa-circle-check"></i>
        <h1>¡Gracias por contactarnos!</h1>
        <p>Hemos recibido tu mensaje correctamente. Uno de nuestros asesores se comunicará contigo a la brevedad posible.</p>
        <a href="index.html" class="btn-volver">
            <i class="fa-regular fa-arrow-left"></i> Volver al inicio
        </a>
    </div>
</body>
</html>
